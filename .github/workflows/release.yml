# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v0.2.1)"
        required: true
        type: string
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  create-release:
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      bazel_test_command: "bazel --noworkspace_rc build //nu/..."
      release_files: |
        dist/rules_nu-*.tar.gz
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      draft: true
    secrets: inherit
  publish-to-bcr:
    needs: create-release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
  publish-release:
    runs-on: ubuntu-latest
    needs: publish-to-bcr
    steps:
      - run: gh release edit "${{ inputs.tag_name || github.ref_name }}" --draft=false --repo "${{ github.repository }}"
    env:
      GH_TOKEN: ${{ github.token }}
